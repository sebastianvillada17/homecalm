<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HOMECALM - Sin Conexión</title>
  <style>
    :root {
      --primary: #176B5B;
      --primary-dark: #104D43;
      --bg: #F4F6F4;
      --card-bg: #FFFFFF;
      --text: #1C2826;
      --muted: #6B7280;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: rgba(23, 107, 91, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(23, 107, 91, 0.25);
    }
    .btn:active {
      transform: scale(0.98);
      background-color: var(--primary-dark);
    }
    .status-badge {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #EF4444;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-title">HOMECALM</div>
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
      </svg>
    </div>
    <h1>Sin conexión a Internet</h1>
    <p>HOMECALM requiere conexión de red para sincronizar tus finanzas, tareas y datos del hogar de manera segura.</p>
    <button class="btn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Reintentar conexión
    </button>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Esperando red WiFi o móvil</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      if (window.navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn');
        const orig = btn.innerHTML;
        btn.innerHTML = 'Verificando red...';
        btn.style.opacity = '0.7';
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.style.opacity = '1';
          if (window.navigator.onLine) {
            window.location.reload();
          }
        }, 1200);
      }
    }

    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
